[project]
name = "stock-picker-agent"
version = "0.1.0"
description = "AI multi-agent stock research + paper-trading API (FastAPI backend for the Next.js frontend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.1",
    "crewai>=1.14.5",
    "crewai-tools>=1.14.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.2",
    "psycopg2-binary>=2.9.10",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.49",
    "supabase>=2.31.0",
    "yfinance>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
