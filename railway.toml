# Railpack natively supports uv-managed Python projects (reads pyproject.toml +
# uv.lock). Nixpacks here generated a broken `pip install uv==` (empty
# $NIXPACKS_UV_VERSION) and failed the build.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "uv run uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
